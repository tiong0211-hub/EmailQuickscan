# EmailQuickscan 기본 설정
#
# 이 파일이 없거나 일부 키가 비어 있어도 프로그램은 config.py의 내장
# 기본값으로 동작한다. PyYAML이 번들되어 있으면 그것으로, 없으면
# config.py의 표준 라이브러리 서브셋 파서로 읽힌다.

indexing:
  # DB에 한 번에 커밋하는 메일 수. 크면 커밋 오버헤드가 줄지만 중단 시
  # 되돌아갈 배치가 커진다.
  batch_size: 1000

  # 파일 단위 병렬 워커 수. 0이면 min(4, cpu_count)를 자동으로 쓴다.
  workers: 0

  retry:
    max_attempts: 3
    # DB lock/busy 시 지수 백오프(초)
    backoff_seconds: [0.5, 1, 2]

  # readpst가 PST를 통째로 풀어낼 임시 디렉터리. null이면 시스템 기본
  # 임시 디렉터리를 쓴다. PST 크기만큼 여유 공간이 필요하다.
  readpst_tmp_dir: null

search:
  fts:
    # Python이 생성한 2-gram 토큰 스트림을 색인할 때 쓰는 FTS5
    # tokenize/detail 옵션. trigram을 원문에 직접 쓰지 않는다(CLAUDE.md
    # 규칙 4) — 2글자 한글 검색이 되지 않기 때문이다.
    tokenize: "unicode61 remove_diacritics 0"
    detail: "column"

  # --sort relevance 요청 시 bm25로 재정렬할 최신 N건 상한. 전체를
  # 정렬하면 100만 건에서 약 700ms가 걸린다(실측) — 최신 N건만 보는
  # 근사치로 200ms 예산 안에 들어오게 한다.
  relevance_candidates: 5000

  # mails.snippet 컬럼(본문 앞부분 미리보기)의 길이.
  snippet_len: 300

  # 색인 전 본문에서 인용 답장 체인("-----Original Message-----" 이하,
  # ">"로 시작하는 줄)을 제거할지. 원본 메일이 이미 따로 색인되어 있어
  # 중복이므로 기본적으로 제거한다. body_z(압축 저장본)에는 항상 원문이
  # 보존되므로 이 값을 나중에 바꿔도 재색인만으로 반영된다.
  strip_quoted_replies: true

encoding:
  # 디코딩 실패(decode_status=failed) 시 raw_body_b64에 보존할 원본
  # 바이트 상한. 256KB.
  max_raw_bytes: 262144

paths:
  db: "data/mail_index.db"
  state: "data/indexing_log.json"
  errors: "data/errors.jsonl"
